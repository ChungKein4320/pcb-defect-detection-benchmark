name: Repository checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependency
        run: python -m pip install Pillow

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate reproducibility artifacts
        run: python scripts/validate_reproducibility.py

      - name: Audit Semi-DETR public safety
        run: python scripts/check_semidetr_public_safety.py
